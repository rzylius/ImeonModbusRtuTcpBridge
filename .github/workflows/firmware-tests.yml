name: Firmware regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: 4-20ma/ModbusMaster
          ref: v2.0.1
          path: vendor-test/ModbusMaster
      - uses: actions/checkout@v4
        with:
          repository: emelianov/modbus-esp8266
          ref: 4.1.0
          path: vendor-test/modbus-esp8266
      - run: python3 tests/run_tests.py --modbusmaster vendor-test/ModbusMaster --modbus-tcp vendor-test/modbus-esp8266
